[package]
name = "orkstage-scan"
description = "OrkStage scan engine: turns IaC and project files into a ScanReport and a platform/v1 template"
documentation = "https://docs.rs/orkstage-scan"
homepage.workspace = true
readme = "README.md"
keywords = ["iac", "terraform", "kubernetes", "scanner", "devops"]
categories = ["development-tools", "parser-implementations"]
# Test fixtures and benchmarks stay in the repository; the published crate is the library.
exclude = ["tests/", "benches/"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
bench = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
hcl-rs.workspace = true
yaml-rust2.workspace = true
toml.workspace = true
regex.workspace = true

[dev-dependencies]
insta = { version = "1.43", features = ["json", "yaml"] }
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "scan"
harness = false

[lints]
workspace = true
