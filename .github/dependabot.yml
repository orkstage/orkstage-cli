version: 2
updates:
  # Rust workspace (Cargo.lock at the root).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      wasm-bindgen:
        # Keep `wasm-bindgen` in step with `wasm-bindgen-cli` in `docker/` and the CI workflow.
        patterns: ['wasm-bindgen', 'js-sys', 'serde-wasm-bindgen']
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  # Rust toolchain image used for builds in containers.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
