name: Security

on:
  # While the repositories are private, Actions minutes are paid: scan only when what is scanned
  # changes, or on demand. At launch (free minutes for public repositories) remove the paths
  # filter and add back a push trigger and a weekly schedule (cron '17 6 * * 1').
  pull_request:
    paths:
      - Cargo.lock
      - '**/Cargo.toml'
      - .github/workflows/security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Known vulnerabilities in the locked dependencies. Fails on critical ones that have a fix.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy (lockfiles)
        run: >-
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.57.1 fs --quiet --scanners vuln
          --severity CRITICAL --ignore-unfixed --exit-code 1 --skip-dirs node_modules --skip-dirs target
          --skip-dirs crates/orkstage-scan/tests/fixtures /src

  # Code scanning and the OpenSSF Scorecard report through GitHub Advanced Security, which private
  # repositories do not have here; these jobs start on their own once the repository is public.
  codeql:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@v3
