name: ci

on:
  # Public repository: Actions minutes are free, so every push to main and every pull request is
  # built, plus a weekly run that keeps caches warm.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

# A new push to a pull request cancels its previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.99'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact --no-banner --verbose
      # Every source file has an SPDX license header; core code does not import ee/ (scripts/spdx.sh).
      - name: License headers and the ee/ boundary
        run: bash scripts/spdx.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo test --workspace --locked
        env:
          CI: 'true' # insta fails on missing/changed snapshots instead of writing them

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      # A prebuilt binary (seconds) instead of compiling it on every run (minutes).
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: sh scripts/build-wasm.sh
      - name: The committed WebAssembly package is up to date
        run: git diff --exit-code -- dist/scan-wasm
      # When it is not, CI's own build is kept for a day: download it and commit it to fix the check.
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: scan-wasm
          path: dist/scan-wasm
          retention-days: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Smoke test the npm package
        run: |
          node -e "const s=require('./dist/scan-wasm'); const r=s.scanFiles([{path:'docker-compose.yml',content:'services:\n  db:\n    image: postgres:17\n'}]); if(!r.resources.some(x=>x.id==='database')) process.exit(1); console.log(s.version())"

  build:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [lint, test]
    env:
      # Signing runs only on tags and only when the secrets exist (forks and PRs build unsigned).
      SIGN_WINDOWS: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT != '' }}
      SIGN_MACOS: ${{ secrets.MACOS_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The release version is the tag's (v0.2.0-rc.1 gives 0.2.0-rc.1), else the crate's. It names
      # the archives, and `ork --version` shows it with the commit and build date.
      - name: Build info
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          case "$GITHUB_REF" in refs/tags/v*) v="${GITHUB_REF_NAME#v}" ;; esac
          echo "ORK_RELEASE_VERSION=$v" >> "$GITHUB_ENV"
          echo "ORK_LONG_VERSION=$v (${GITHUB_SHA::7} $(date -u +%Y-%m-%d))" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p ork-cli --target ${{ matrix.target }}

      # Code signing. Unsigned binaries are blocked by application control on many Windows
      # machines and by Gatekeeper on macOS, so releases must be signed.
      # Windows: Authenticode, for example Azure Trusted Signing (the `azure/trusted-signing-action`
      # action) or signtool with an EV certificate; timestamp every signature.
      # macOS: codesign with a Developer ID Application certificate and the hardened runtime,
      # then notarize with `xcrun notarytool submit --wait` (zip the binary first).
      - name: Sign (Windows, Authenticode)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/') && env.SIGN_WINDOWS == 'true'
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: target/${{ matrix.target }}/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/') && env.SIGN_MACOS == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security list-keychains -s build.keychain
          security unlock-keychain -p ci build.keychain
          BIN=target/${{ matrix.target }}/release/ork
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$BIN"
          ditto -c -k --keepParent "$BIN" ork.zip
          xcrun notarytool submit ork.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait

      # Archives with the binary at the root, plus LICENSE and README (what the install scripts expect).
      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          v="$ORK_RELEASE_VERSION"
          mkdir -p pkg artifacts
          cp target/${{ matrix.target }}/release/ork LICENSE README.md pkg/
          tar -czf "artifacts/ork-$v-${{ matrix.target }}.tar.gz" -C pkg ork LICENSE README.md
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = $env:ORK_RELEASE_VERSION
          New-Item -ItemType Directory -Force pkg, artifacts | Out-Null
          Copy-Item target/${{ matrix.target }}/release/ork.exe, LICENSE, README.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath "artifacts/ork-$v-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: ork-${{ matrix.target }}
          # Not dist/: that directory is in the repository (dist/scan-wasm).
          path: artifacts/*
          if-no-files-found: error
          # Only the release job of the same run reads them.
          retention-days: 3

  # A version tag (v0.2.0, or v0.2.0-rc.1 for a prerelease) publishes a GitHub Release with every
  # archive, the install scripts and SHA256SUMS.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the crate version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          case "${GITHUB_REF_NAME#v}" in
            "$v" | "$v"-*) ;;
            *) echo "::error::tag $GITHUB_REF_NAME does not match version $v in Cargo.toml"; exit 1 ;;
          esac
      - uses: actions/download-artifact@v6
        with:
          pattern: ork-*
          # Not dist/: that directory is in the repository (dist/scan-wasm).
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: |
          cp ../scripts/install.sh ../scripts/install.ps1 .
          sha256sum ork-* install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS
      # Attestations need a public repository (or GitHub Enterprise Cloud for private ones).
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/ork-*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* --verify-tag --generate-notes --title "ork ${GITHUB_REF_NAME#v}" $pre

  # Installs the release just published with both scripts on clean runners. The files are served
  # from the runner itself, because a private repository's release cannot be downloaded anonymously.
  install-test:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D rel
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          ORK_VERSION: ${{ github.ref_name }}
          ORK_DOWNLOAD_BASE: http://127.0.0.1:8765
          ORK_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          (cd rel && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8765/SHA256SUMS && break; sleep 1; done
          sh rel/install.sh
          "$ORK_INSTALL_DIR/ork" --version | tee /dev/stderr | grep -F "${GITHUB_REF_NAME#v}"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ORK_VERSION: ${{ github.ref_name }}
          ORK_DOWNLOAD_BASE: http://127.0.0.1:8765
          ORK_INSTALL_DIR: ${{ runner.temp }}\bin
        run: |
          Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1' -WorkingDirectory rel -WindowStyle Hidden
          foreach ($i in 1..30) { try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/SHA256SUMS | Out-Null; break } catch { Start-Sleep -Seconds 1 } }
          ./rel/install.ps1
          $out = & "$env:ORK_INSTALL_DIR\ork.exe" --version
          Write-Host $out
          if ($out -notmatch [regex]::Escape($env:ORK_VERSION.TrimStart('v'))) { throw "unexpected version: $out" }
